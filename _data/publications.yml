    description: >-
      This work jointly optimizes train timetables and passenger flow guidance to make urban rail transit greener and more passenger-friendly.
      Verified on Chongqing Metro Lines 1, 2, and 3, the method reduces traction energy consumption by 0.68 % and cuts average passenger waiting time by 7.79 %—meaning commuters spend noticeably less time standing on platforms while the transit system runs more efficiently.
